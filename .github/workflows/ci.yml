name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python conformance/stdlib_check.py
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: python -m pytest
      - run: python -m pip check
      - run: python -m pip_audit --strict .

  typescript:
    name: TypeScript conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --experimental-strip-types implementations/typescript/run_conformance.ts conformance/vectors.json

  go:
    name: Go conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - shell: bash
        run: test -z "$(gofmt -d implementations/go/verifier/verifier.go implementations/go/cmd/conformance/main.go)"
      - run: go -C implementations/go vet ./...
      - run: go -C implementations/go run ./cmd/conformance ../../conformance/vectors.json
