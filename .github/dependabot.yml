version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "actions/*"
  - package-ecosystem: gomod
    directory: "/implementations/go"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      javascript-toolchain:
        patterns:
          - "typescript"
          - "@types/node"
